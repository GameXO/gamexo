[project]
name = "gamexo-api"
version = "0.1.0"
description = "Multi-tenant backend for gamexo — white-label SaaS for sports academies"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    # Declared directly, not leaned on as python-jose's transitive dependency:
    # app/core/crypto.py imports Fernet itself to encrypt tenant payment
    # credentials, and that must not break the day jose changes its extras.
    "cryptography>=43.0.0",
    # The plan called for passlib[bcrypt]; passlib 1.7.4 (2020) cannot initialise its
    # bcrypt backend against bcrypt >= 5. See app/core/security.py for the detail.
    # Same algorithm, same $2b$ hash format.
    "bcrypt>=5.0.0",
    "email-validator>=2.2.0",
    # Async SMTP. smtplib is stdlib but blocking, and one slow handshake to the mail
    # server would stall the event loop for every other request being served. Still
    # here as the fallback transport when no Resend key is configured.
    "aiosmtplib>=4.0.0",
    # Resend's HTTP API is the primary mail transport. Runtime, not dev: the image
    # is built with `uv sync --no-dev`, so a dev-only httpx would be absent exactly
    # where mail is actually sent.
    "httpx>=0.28.0",
    # zoneinfo has no bundled tz database on Windows (unlike Linux/macOS, which read
    # the OS's own IANA copy) — without this, ZoneInfo("Asia/Kolkata") raises
    # ZoneInfoNotFoundError the first time anything prices a booking by local time.
    "tzdata>=2024.1; sys_platform == 'win32'",
    # Multipart form parsing. FastAPI needs it for UploadFile and does not pull it
    # in itself — without it, POST /uploads fails at import with a runtime hint
    # rather than at install.
    "python-multipart>=0.0.20",
    # S3 client, talking to Cloudflare R2 through its S3-compatible API. Optional at
    # runtime — app/core/storage.py imports it lazily and falls back to local disk —
    # but declared, because a deployment that sets R2_* and then discovers boto3 is
    # missing finds out when someone uploads a logo.
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

# This is an application, not a distributable library — nothing to build or install.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. The SQLAlchemy engine is created at import
# and its asyncpg connections are bound to the loop that opened them; a fresh loop
# per test would hand the pool connections belonging to a loop that no longer exists.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
